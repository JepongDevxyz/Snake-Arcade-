<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Neon Snake Arcade - Swipe Gestures & Multi-Touch</title>
  <!-- PeerJS Library -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      overflow: hidden;
    }

    .game-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 500px;
      width: 100%;
      max-height: 98vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    .player-status-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .score-box { color: #10b981; }
    .score-box2 { color: #3b82f6; }
    .lives-display { font-size: 12px; }

    .room-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .room-inputs {
      display: flex;
      gap: 6px;
    }

    .room-inputs input {
      flex: 1;
      background: #030712;
      border: 1px solid #374151;
      color: #fff;
      padding: 6px;
      border-radius: 6px;
      font-size: 12px;
      text-transform: uppercase;
      text-align: center;
      font-weight: bold;
      letter-spacing: 2px;
      touch-action: auto;
    }

    .room-btn {
      background: #3b82f6;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .voice-bar {
      display: flex;
      gap: 6px;
      width: 100%;
      margin-bottom: 6px;
    }

    .voice-btn {
      flex: 1;
      background: #10b981;
      border: none;
      color: #fff;
      padding: 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .voice-btn.active { background: #ef4444; }

    .status-text {
      font-size: 11px;
      color: #9ca3af;
      text-align: center;
    }

    .canvas-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    canvas {
      background-color: #030712;
      border: 2px solid #374151;
      border-radius: 10px;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
      max-width: 100%;
      max-height: 38vh;
      aspect-ratio: 1 / 1;
    }

    .emote-bar {
      display: flex;
      justify-content: space-around;
      width: 100%;
      background: #030712;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 4px;
      margin-top: 6px;
    }

    .emote-btn {
      background: #1f2937;
      border: 1px solid #374151;
      font-size: 18px;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.05s, background 0.05s;
    }

    .emote-btn:active, .emote-btn.active {
      transform: scale(1.25);
      background: #3b82f6;
    }

    .chat-container {
      width: 100%;
      background: #030712;
      border: 1px solid #374151;
      border-radius: 8px;
      margin-top: 6px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chat-messages {
      height: 38px;
      overflow-y: auto;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-right: 4px;
    }

    .chat-msg {
      line-height: 1.2;
      word-break: break-word;
    }

    .chat-msg.p1 { color: #10b981; }
    .chat-msg.p2 { color: #3b82f6; }
    .chat-msg.system { color: #9ca3af; font-style: italic; }

    .chat-input-box {
      display: flex;
      gap: 4px;
    }

    .chat-input-box input {
      flex: 1;
      background: #111827;
      border: 1px solid #374151;
      color: #fff;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 11px;
      touch-action: auto;
      user-select: text;
    }

    .chat-send-btn {
      background: #10b981;
      border: none;
      color: #fff;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .controls-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-around;
      width: 100%;
      margin-top: 6px;
      gap: 15px;
    }

    .joystick-container {
      width: 85px;
      height: 85px;
      background: #1f2937;
      border: 2px solid #374151;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .joystick-stick {
      width: 36px;
      height: 36px;
      background: #10b981;
      border-radius: 50%;
      position: absolute;
      box-shadow: 0 0 10px #10b981;
      pointer-events: none;
      transition: transform 0.03s ease-out;
    }

    .boost-btn {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      border: 2px solid #fcf26b;
      color: #ffffff;
      font-size: 11px;
      font-weight: 900;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
      transition: transform 0.05s, filter 0.05s;
    }

    .boost-btn:active, .boost-btn.active {
      transform: scale(0.90);
      filter: brightness(1.3);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.9);
    }

    .boost-btn span { font-size: 16px; line-height: 1; }

    .restart-btn {
      margin-top: 6px;
      background: #ef4444;
      border: none;
      color: #ffffff;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    
    

    .restart-btn:hover { background: #dc2626; }
  </style>
</head>

<style>
  /* Base Container */
  #preloader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: #0d0d0d;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 999999;
    transition: opacity 0.6s ease, visibility 0.6s ease;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Spinner Animation */
  .loader-spinner {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(255, 255, 255, 0.1);
    border-top: 4px solid #ff5722;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
    transition: border-top-color 0.3s ease;
  }

  /* Brand Text */
  .brand-title {
    color: #ffffff;
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 2px;
    margin: 0;
    text-transform: uppercase;
    background: linear-gradient(45deg, #ff5722, #38b6ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Status Badge Indicator */
  .status-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    padding: 6px 14px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 20px;
    font-size: 0.85rem;
    color: #cccccc;
    letter-spacing: 0.5px;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background-color: #ff9f0a; /* Orange: Checking */
    transition: background-color 0.3s ease, box-shadow 0.3s ease;
  }

  .status-dot.active {
    background-color: #30d158; /* Green: Active */
    box-shadow: 0 0 10px #30d158;
  }

  .status-dot.down {
    background-color: #ff3b30; /* Red: Down */
    box-shadow: 0 0 10px #ff3b30;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  #preloader.preloader-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
</style>

<!-- HTML Markup -->
<div id="preloader">
  <div class="loader-spinner" id="loaderSpinner"></div>
  <h1 class="brand-title">Jepong Devxyz</h1>
  
  <div class="status-badge">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText" style="color: #ff9f0a;">Checking site status...</span>
  </div>
</div>

<!-- JavaScript Logic -->
<script>
  window.addEventListener('load', async function() {
    const preloader = document.getElementById('preloader');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const spinner = document.getElementById('loaderSpinner');

    const startTime = Date.now();
    let isSiteActive = false;

    // Subukang i-check ang status
    try {
      // Kung binuksan lang bilang local file (file://), ituturing itong active para sa testing
      if (window.location.protocol === 'file:') {
        isSiteActive = true;
      } else {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3500);

        const response = await fetch(window.location.href, {
          method: 'GET',
          cache: 'no-store',
          signal: controller.signal
        });

        clearTimeout(timeoutId);

        if (response.ok || response.status < 400) {
          isSiteActive = true;
        }
      }
    } catch (error) {
      isSiteActive = false;
    }

    // Maghintay muna nang kahit 1.5 seconds para makita ng user na nag "Checking site status..." muna
    const elapsed = Date.now() - startTime;
    if (elapsed < 1500) {
      await new Promise(resolve => setTimeout(resolve, 1500 - elapsed));
    }

    // PAGKATAPOS MAG-CHECK: Dito pa lang magpapalit ng status badge
    if (isSiteActive) {
      statusDot.className = 'status-dot active';
      statusText.innerText = 'Site Active - Opening...';
      statusText.style.color = '#30d158';

      // Kwentahin ang natitirang oras para makumpleto ang 5 seconds total delay
      const totalElapsed = Date.now() - startTime;
      const remainingTime = Math.max(0, 5000 - totalElapsed);

      setTimeout(function() {
        preloader.classList.add('preloader-hidden');
      }, remainingTime);

    } else {
      statusDot.className = 'status-dot down';
      statusText.innerText = 'Site Down / Offline';
      statusText.style.color = '#ff3b30';
      
      // Magiging pula ang spinner pero tuloy-tuloy pa rin ang ikot
      spinner.style.borderTopColor = '#ff3b30';
    }
  });
</script>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const score2El = document.getElementById('score2');
    const p1LivesEl = document.getElementById('p1Lives');
    const p2LivesEl = document.getElementById('p2Lives');
    const p1MultEl = document.getElementById('p1Multiplier');
    const p2MultEl = document.getElementById('p2Multiplier');
    const statusText = document.getElementById('statusText');
    const myRoomIdEl = document.getElementById('myRoomId');
    const micToggleBtn = document.getElementById('micToggleBtn');
    const remoteAudio = document.getElementById('remoteAudio');

    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');

    let p1EmoteData = null;
    let p2EmoteData = null;

    function triggerEmote(emoji) {
      if (isHost) {
        p1EmoteData = { emoji: emoji, opacity: 1.0, offsetY: 0 };
      } else {
        if (conn && conn.open) {
          conn.send({ type: 'EMOTE', emoji: emoji });
        }
      }
    }

    const emoteButtons = document.querySelectorAll('.emote-btn');
    emoteButtons.forEach(btn => {
      const handleEmoteAction = (e) => {
        e.preventDefault();
        e.stopPropagation();
        initAudio();
        const emoji = btn.getAttribute('data-emoji');
        btn.classList.add('active');
        setTimeout(() => btn.classList.remove('active'), 150);
        triggerEmote(emoji);
      };

      btn.addEventListener('touchstart', handleEmoteAction, { passive: false });
      btn.addEventListener('click', handleEmoteAction);
    });

    function appendMessage(sender, text, type) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `chat-msg ${type}`;
      msgDiv.textContent = `${sender}: ${text}`;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function sendChatMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      const playerLabel = isHost ? 'P1' : 'P2';
      const playerType = isHost ? 'p1' : 'p2';

      appendMessage(playerLabel, text, playerType);
      chatInput.value = '';

      if (conn && conn.open) {
        conn.send({
          type: 'CHAT',
          sender: playerLabel,
          senderType: playerType,
          text: text
        });
      }
    }

    function handleChatKeyDown(e) {
      e.stopPropagation();
      if (e.key === 'Enter') sendChatMessage();
    }

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playEatSound(isPowerup = false) {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = isPowerup ? 'triangle' : 'sine';
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (isPowerup) {
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else {
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
        osc.start(now); osc.stop(now + 0.09);
      }
    }

    let boostOsc = null;
    let boostGain = null;

    function startBoostSound() {
      initAudio();
      if (!audioCtx || boostOsc) return;
      boostOsc = audioCtx.createOscillator();
      boostGain = audioCtx.createGain();
      boostOsc.type = 'sawtooth';
      boostOsc.frequency.setValueAtTime(120, audioCtx.currentTime);
      boostOsc.frequency.linearRampToValueAtTime(220, audioCtx.currentTime + 0.3);
      boostGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      boostOsc.connect(boostGain);
      boostGain.connect(audioCtx.destination);
      boostOsc.start();
    }

    function stopBoostSound() {
      if (boostGain && audioCtx) {
        boostGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        setTimeout(() => {
          if (boostOsc) {
            boostOsc.stop();
            boostOsc.disconnect();
            boostOsc = null;
          }
        }, 100);
      }
    }

    function playHitSound() {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    }

    let localStream = null;
    let mediaCall = null;
    let isMicActive = false;

    async function toggleVoiceChat() {
      if (!isMicActive) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          isMicActive = true;
          micToggleBtn.classList.add('active');
          micToggleBtn.innerHTML = '<span>🎙️</span> Mute Voice Chat';
          const targetPeerId = isHost ? (conn ? conn.peer : null) : 'nsa-' + document.getElementById('roomIdInput').value.trim();
          if (targetPeerId && peer) {
            mediaCall = peer.call(targetPeerId, localStream);
            handleMediaCall(mediaCall);
          }
        } catch (err) {
          alert('Maling Akses sa Mikropono.');
        }
      } else {
        if (localStream) {
          localStream.getTracks().forEach(track => track.enabled = !track.enabled);
          const isEnabled = localStream.getAudioTracks()[0]
