<!DOCTYPE html>
<!-- Jay-Ar Lee Espiritu -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Snake Arcade</title>
  <!-- PeerJS Library -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  
  <style>
    /* ==================== PRELOADER STYLES ==================== */
    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0d0d0d;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .loader-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid #ff5722;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
      transition: border-top-color 0.3s ease;
    }

    .brand-title {
      color: #ffffff;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin: 0;
      text-transform: uppercase;
      background: linear-gradient(45deg, #ff5722, #38b6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      font-size: 0.85rem;
      color: #cccccc;
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #ff9f0a; /* Orange: Checking */
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .status-dot.active {
      background-color: #30d158; /* Green: Active */
      box-shadow: 0 0 10px #30d158;
    }

    .status-dot.down {
      background-color: #ff3b30; /* Red: Down */
      box-shadow: 0 0 10px #ff3b30;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #preloader.preloader-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* ==================== GAME STYLES ==================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      overflow: hidden;
    }

    .game-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 500px;
      width: 100%;
      max-height: 98vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
    }

    .player-status-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .score-box { color: #10b981; }
    .score-box2 { color: #3b82f6; }
    .lives-display { font-size: 12px; }

    .room-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .room-inputs {
      display: flex;
      gap: 6px;
    }

    .room-inputs input {
      flex: 1;
      background: #030712;
      border: 1px solid #374151;
      color: #fff;
      padding: 6px;
      border-radius: 6px;
      font-size: 12px;
      text-transform: uppercase;
      text-align: center;
      font-weight: bold;
      letter-spacing: 2px;
      touch-action: auto;
    }

    .room-btn {
      background: #3b82f6;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .voice-bar {
      display: flex;
      gap: 6px;
      width: 100%;
      margin-bottom: 6px;
    }

    .voice-btn {
      flex: 1;
      background: #10b981;
      border: none;
      color: #fff;
      padding: 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .voice-btn.active { background: #ef4444; }

    .status-text {
      font-size: 11px;
      color: #9ca3af;
      text-align: center;
    }

    .canvas-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    canvas {
      background-color: #030712;
      border: 2px solid #374151;
      border-radius: 10px;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
      max-width: 100%;
      max-height: 38vh;
      aspect-ratio: 1 / 1;
    }

    .emote-bar {
      display: flex;
      justify-content: space-around;
      width: 100%;
      background: #030712;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 4px;
      margin-top: 6px;
    }

    .emote-btn {
      background: #1f2937;
      border: 1px solid #374151;
      font-size: 18px;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.05s, background 0.05s;
    }

    .emote-btn:active, .emote-btn.active {
      transform: scale(1.25);
      background: #3b82f6;
    }

    .chat-container {
      width: 100%;
      background: #030712;
      border: 1px solid #374151;
      border-radius: 8px;
      margin-top: 6px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chat-messages {
      height: 38px;
      overflow-y: auto;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-right: 4px;
    }

    .chat-msg {
      line-height: 1.2;
      word-break: break-word;
    }

    .chat-msg.p1 { color: #10b981; }
    .chat-msg.p2 { color: #3b82f6; }
    .chat-msg.system { color: #9ca3af; font-style: italic; }

    .chat-input-box {
      display: flex;
      gap: 4px;
    }

    .chat-input-box input {
      flex: 1;
      background: #111827;
      border: 1px solid #374151;
      color: #fff;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 11px;
      touch-action: auto;
      user-select: text;
    }

    .chat-send-btn {
      background: #10b981;
      border: none;
      color: #fff;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .controls-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-around;
      width: 100%;
      margin-top: 6px;
      gap: 15px;
    }

    .joystick-container {
      width: 85px;
      height: 85px;
      background: #1f2937;
      border: 2px solid #374151;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .joystick-stick {
      width: 36px;
      height: 36px;
      background: #10b981;
      border-radius: 50%;
      position: absolute;
      box-shadow: 0 0 10px #10b981;
      pointer-events: none;
      transition: transform 0.03s ease-out;
    }

    .boost-btn {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      border: 2px solid #fcf26b;
      color: #ffffff;
      font-size: 11px;
      font-weight: 900;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
      transition: transform 0.05s, filter 0.05s;
    }

    .boost-btn:active, .boost-btn.active {
      transform: scale(0.90);
      filter: brightness(1.3);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.9);
    }

    .boost-btn span { font-size: 16px; line-height: 1; }

    .restart-btn {
      margin-top: 6px;
      background: #ef4444;
      border: none;
      color: #ffffff;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }

    .restart-btn:hover { background: #dc2626; }
  </style>
</head>
<body>

  <!-- ==================== PRELOADER OVERLAY ==================== -->
  <div id="preloader">
    <div class="loader-spinner" id="loaderSpinner"></div>
    <h1 class="brand-title">Jepong Devxyz</h1>
    
    <div class="status-badge">
      <span class="status-dot" id="statusDot"></span>
      <span id="loaderStatusText" style="color: #ff9f0a;">Checking site status...</span>
    </div>
  </div>

  <!-- ==================== GAME CONTENT ==================== -->
  <div class="game-card">
    <div class="room-container">
      <div class="room-inputs">
        <input type="text" id="roomIdInput" maxlength="4" placeholder="4-DIGIT CODE">
        <button class="room-btn" onclick="joinRoom()">Join Room</button>
      </div>
      <div class="status-text" id="statusText">Your 4-Digit Room Code: <b id="myRoomId">----</b></div>
    </div>

    <div class="voice-bar">
      <button class="voice-btn" id="micToggleBtn" onclick="toggleVoiceChat()">
        <span>🎙️</span> Enable Voice Chat
      </button>
    </div>

    <div class="header">
      <div class="player-status-box score-box">
        <div>P1: <span id="score">0</span> <small id="p1Multiplier"></small></div>
        <div class="lives-display" id="p1Lives">❤️❤️❤️</div>
      </div>

      <div class="player-status-box score-box2">
        <div>P2: <span id="score2">0</span> <small id="p2Multiplier"></small></div>
        <div class="lives-display" id="p2Lives">❤️❤️❤️</div>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="320" height="320"></canvas>
    </div>

    <div class="emote-bar" id="emoteBar">
      <button class="emote-btn" data-emoji="😎">😎</button>
      <button class="emote-btn" data-emoji="😂">😂</button>
      <button class="emote-btn" data-emoji="💩">💩</button>
      <button class="emote-btn" data-emoji="🔥">🔥</button>
      <button class="emote-btn" data-emoji="💀">💀</button>
      <button class="emote-btn" data-emoji="👑">👑</button>
    </div>

    <div class="chat-container">
      <div class="chat-messages" id="chatMessages">
        <div class="chat-msg system">System: Swipe screen or use joystick to play!</div>
      </div>
      <div class="chat-input-box">
        <input type="text" id="chatInput" placeholder="Type a message..." onkeydown="handleChatKeyDown(event)">
        <button class="chat-send-btn" onclick="sendChatMessage()">Send</button>
      </div>
    </div>

    <div class="controls-wrapper">
      <div class="joystick-container" id="joystick">
        <div class="joystick-stick" id="stick"></div>
      </div>

      <button class="boost-btn" id="boostBtn">
        <span>⚡</span>
        BOOST
      </button>
    </div>

    <button class="restart-btn" onclick="resetGame()">Ulitin / Restart Game</button>
  </div>

  <audio id="remoteAudio" autoplay></audio>

  <!-- ==================== PRELOADER SCRIPT ==================== -->
  <script>
    window.addEventListener('load', async function() {
      const preloader = document.getElementById('preloader');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('loaderStatusText');
      const spinner = document.getElementById('loaderSpinner');

      const startTime = Date.now();
      let isSiteActive = false;

      try {
        if (window.location.protocol === 'file:') {
          isSiteActive = true;
        } else {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 3500);

          const response = await fetch(window.location.href, {
            method: 'GET',
            cache: 'no-store',
            signal: controller.signal
          });

          clearTimeout(timeoutId);

          if (response.ok || response.status < 400) {
            isSiteActive = true;
          }
        }
      } catch (error) {
        isSiteActive = false;
      }

      const elapsed = Date.now() - startTime;
      if (elapsed < 1500) {
        await new Promise(resolve => setTimeout(resolve, 1500 - elapsed));
      }

      if (isSiteActive) {
        statusDot.className = 'status-dot active';
        statusText.innerText = 'Active / Online';
        statusText.style.color = '#30d158';

        const totalElapsed = Date.now() - startTime;
        const remainingTime = Math.max(0, 5000 - totalElapsed);

        setTimeout(function() {
          preloader.classList.add('preloader-hidden');
        }, remainingTime);

      } else {
        statusDot.className = 'status-dot down';
        statusText.innerText = 'Down / Offline';
        statusText.style.color = '#ff3b30';
        spinner.style.borderTopColor = '#ff3b30';
      }
    });
  </script>

  <!-- ==================== GAME SCRIPT ==================== -->
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const score2El = document.getElementById('score2');
    const p1LivesEl = document.getElementById('p1Lives');
    const p2LivesEl = document.getElementById('p2Lives');
    const p1MultEl = document.getElementById('p1Multiplier');
    const p2MultEl = document.getElementById('p2Multiplier');
    const statusText = document.getElementById('statusText');
    const myRoomIdEl = document.getElementById('myRoomId');
    const micToggleBtn = document.getElementById('micToggleBtn');
    const remoteAudio = document.getElementById('remoteAudio');

    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');

    let p1EmoteData = null;
    let p2EmoteData = null;

    function triggerEmote(emoji) {
      if (isHost) {
        p1EmoteData = { emoji: emoji, opacity: 1.0, offsetY: 0 };
      } else {
        if (conn && conn.open) {
          conn.send({ type: 'EMOTE', emoji: emoji });
        }
      }
    }

    const emoteButtons = document.querySelectorAll('.emote-btn');
    emoteButtons.forEach(btn => {
      const handleEmoteAction = (e) => {
        e.preventDefault();
        e.stopPropagation();
        initAudio();
        const emoji = btn.getAttribute('data-emoji');
        btn.classList.add('active');
        setTimeout(() => btn.classList.remove('active'), 150);
        triggerEmote(emoji);
      };

      btn.addEventListener('touchstart', handleEmoteAction, { passive: false });
      btn.addEventListener('click', handleEmoteAction);
    });

    function appendMessage(sender, text, type) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `chat-msg ${type}`;
      msgDiv.textContent = `${sender}: ${text}`;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function sendChatMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      const playerLabel = isHost ? 'P1' : 'P2';
      const playerType = isHost ? 'p1' : 'p2';

      appendMessage(playerLabel, text, playerType);
      chatInput.value = '';

      if (conn && conn.open) {
        conn.send({
          type: 'CHAT',
          sender: playerLabel,
          senderType: playerType,
          text: text
        });
      }
    }

    function handleChatKeyDown(e) {
      e.stopPropagation();
      if (e.key === 'Enter') sendChatMessage();
    }

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playEatSound(isPowerup = false) {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = isPowerup ? 'triangle' : 'sine';
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (isPowerup) {
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now); osc.stop(now + 0.2);
      } else {
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
        osc.start(now); osc.stop(now + 0.09);
      }
    }

    let boostOsc = null;
    let boostGain = null;

    function startBoostSound() {
      initAudio();
      if (!audioCtx || boostOsc) return;
      boostOsc = audioCtx.createOscillator();
      boostGain = audioCtx.createGain();
      boostOsc.type = 'sawtooth';
      boostOsc.frequency.setValueAtTime(120, audioCtx.currentTime);
      boostOsc.frequency.linearRampToValueAtTime(220, audioCtx.currentTime + 0.3);
      boostGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      boostOsc.connect(boostGain);
      boostGain.connect(audioCtx.destination);
      boostOsc.start();
    }

    function stopBoostSound() {
      if (boostGain && audioCtx) {
        boostGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        setTimeout(() => {
          if (boostOsc) {
            boostOsc.stop();
            boostOsc.disconnect();
            boostOsc = null;
          }
        }, 100);
      }
    }

    function playHitSound() {
      initAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    }

    let localStream = null;
    let mediaCall = null;
    let isMicActive = false;

    async function toggleVoiceChat() {
      if (!isMicActive) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          isMicActive = true;
          micToggleBtn.classList.add('active');
          micToggleBtn.innerHTML = '<span>🎙️</span> Mute Voice Chat';
          const targetPeerId = isHost ? (conn ? conn.peer : null) : 'nsa-' + document.getElementById('roomIdInput').value.trim();
          if (targetPeerId && peer) {
            mediaCall = peer.call(targetPeerId, localStream);
            handleMediaCall(mediaCall);
          }
        } catch (err) {
          alert('Maling Akses sa Mikropono.');
        }
      } else {
        if (localStream) {
          localStream.getTracks().forEach(track => track.enabled = !track.enabled);
          const isEnabled = localStream.getAudioTracks()[0].enabled;
          micToggleBtn.innerHTML = isEnabled ? '<span>🎙️</span> Mute Voice Chat' : '<span>🔇</span> Unmute Voice Chat';
          if (!isEnabled) micToggleBtn.classList.remove('active');
          else micToggleBtn.classList.add('active');
        }
      }
    }

    function handleMediaCall(call) {
      call.on('stream', (remoteStream) => { remoteAudio.srcObject = remoteStream; });
    }

    const gridSize = 16;
    const tileCount = canvas.width / gridSize;

    let snake = [{ x: 5, y: 10 }];
    let dx = 1, dy = 0, nextDx = 1, nextDy = 0;
    let score = 0, p1Lives = 3, p1Boost = false, p1DoubleTimer = 0;

    let snake2 = [{ x: 15, y: 10 }];
    let dx2 = -1, dy2 = 0;
    let score2 = 0, p2Lives = 3, p2Boost = false, p2DoubleTimer = 0;

    let food = { x: 10, y: 10 };
    let doubleFood = null;

    let gameLoop;
    let isGameOver = false;
    let winnerMessage = "";

    let peer = null, conn = null, isHost = true;
    let myCode = Math.floor(1000 + Math.random() * 9000).toString();

    function initPeer() {
      peer = new Peer('nsa-' + myCode);
      peer.on('open', () => { myRoomIdEl.textContent = myCode; });
      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          myCode = Math.floor(1000 + Math.random() * 9000).toString();
          initPeer();
        }
      });
      peer.on('connection', (c) => {
        conn = c; isHost = true; setupConnection();
        statusText.textContent = "Status: Player 2 Connected!";
        appendMessage('System', 'Player 2 connected.', 'system');
      });
      peer.on('call', (call) => {
        call.answer(localStream || null);
        handleMediaCall(call);
      });
    }

    function joinRoom() {
      const targetCode = document.getElementById('roomIdInput').value.trim();
      if (targetCode.length !== 4) return alert("Paki-enter ang 4-digit code!");
      conn = peer.connect('nsa-' + targetCode);
      isHost = false; setupConnection();
      statusText.textContent = "Status: Connecting to Room " + targetCode + "...";
    }

    function setupConnection() {
      conn.on('open', () => {
        statusText.textContent = "Status: Connected! Game Sync Active.";
        appendMessage('System', 'Connected to the room!', 'system');
      });

      conn.on('data', (data) => {
        if (data.type === 'CHAT') return appendMessage(data.sender, data.text, data.senderType);

        if (isHost) {
          if (data.type === 'INPUT') {
            if (data.dir === 'UP' && dy2 === 0) { dx2 = 0; dy2 = -1; }
            if (data.dir === 'DOWN' && dy2 === 0) { dx2 = 0; dy2 = 1; }
            if (data.dir === 'LEFT' && dx2 === 0) { dx2 = -1; dy2 = 0; }
            if (data.dir === 'RIGHT' && dx2 === 0) { dx2 = 1; dy2 = 0; }
            p2Boost = !!data.boost;
          }
          if (data.type === 'EMOTE') {
            p2EmoteData = { emoji: data.emoji, opacity: 1.0, offsetY: 0 };
          }
        } else {
          if (data.type === 'SYNC') {
            snake = data.snake; snake2 = data.snake2;
            food = data.food; doubleFood = data.doubleFood;
            score = data.score; score2 = data.score2;
            p1Lives = data.p1Lives; p2Lives = data.p2Lives;
            p1DoubleTimer = data.p1DoubleTimer; p2DoubleTimer = data.p2DoubleTimer;
            isGameOver = data.isGameOver; winnerMessage = data.winnerMessage;
            
            if (data.p1Emote) p1EmoteData = { emoji: data.p1Emote, opacity: 1.0, offsetY: 0 };
            if (data.p2Emote) p2EmoteData = { emoji: data.p2Emote, opacity: 1.0, offsetY: 0 };

            if (data.audioEvent === 'EAT_NORMAL') playEatSound(false);
            if (data.audioEvent === 'EAT_POWERUP') playEatSound(true);
            if (data.audioEvent === 'HIT_DAMAGE') playHitSound();

            updateUI(); draw();
          }
        }
      });
    }

    let tickCounter = 0;
    function start() { gameLoop = setInterval(update, 50); }

    function update() {
      if (isGameOver) return;

      if (isHost) {
        tickCounter++;
        let currentAudioEvent = null;

        if (p1DoubleTimer > 0) p1DoubleTimer--;
        if (p2DoubleTimer > 0) p2DoubleTimer--;

        if (p1Lives > 0 && (p1Boost || tickCounter % 2 === 0)) {
          let event = movePlayer1();
          if (event) currentAudioEvent = event;
        }

        if (p2Lives > 0 && (p2Boost || tickCounter % 2 === 0)) {
          let event = movePlayer2();
          if (event) currentAudioEvent = event;
        }

        if (currentAudioEvent === 'EAT_NORMAL') playEatSound(false);
        if (currentAudioEvent === 'EAT_POWERUP') playEatSound(true);
        if (currentAudioEvent === 'HIT_DAMAGE') playHitSound();

        if (p1Lives <= 0 || p2Lives <= 0) {
          isGameOver = true;
          if (p1Lives <= 0 && p2Lives <= 0) winnerMessage = "IT'S A DRAW!";
          else if (p1Lives <= 0) winnerMessage = "PLAYER 2 WINS! 🎉";
          else if (p2Lives <= 0) winnerMessage = "PLAYER 1 WINS! 🎉";
        }

        if (!doubleFood && Math.random() < 0.005) spawnDoubleFood();

        updateUI();

        let syncP1Emote = (p1EmoteData && p1EmoteData.opacity === 1.0) ? p1EmoteData.emoji : null;
        let syncP2Emote = (p2EmoteData && p2EmoteData.opacity === 1.0) ? p2EmoteData.emoji : null;

        if (conn && conn.open) {
          conn.send({
            type: 'SYNC',
            snake, snake2, food, doubleFood,
            score, score2, p1Lives, p2Lives,
            p1DoubleTimer, p2DoubleTimer,
            p1Emote: syncP1Emote, p2Emote: syncP2Emote,
            isGameOver, winnerMessage,
            audioEvent: currentAudioEvent
          });
        }
        draw();
      }
    }

    function resetPlayer1() { snake = [{ x: 5, y: 10 }]; dx = 1; dy = 0; nextDx = 1; nextDy = 0; }
    function resetPlayer2() { snake2 = [{ x: 15, y: 10 }]; dx2 = -1; dy2 = 0; }

    function movePlayer1() {
      dx = nextDx; dy = nextDy;
      const head = { x: (snake[0].x + dx + tileCount) % tileCount, y: (snake[0].y + dy + tileCount) % tileCount };
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        p1Lives--; resetPlayer1(); return 'HIT_DAMAGE';
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += (p1DoubleTimer > 0) ? 20 : 10; spawnFood(); return 'EAT_NORMAL';
      } else if (doubleFood && head.x === doubleFood.x && head.y === doubleFood.y) {
        p1DoubleTimer = 100; doubleFood = null; return 'EAT_POWERUP';
      } else snake.pop();
      return null;
    }

    function movePlayer2() {
      const head2 = { x: (snake2[0].x + dx2 + tileCount) % tileCount, y: (snake2[0].y + dy2 + tileCount) % tileCount };
      if (snake2.some(segment => segment.x === head2.x && segment.y === head2.y)) {
        p2Lives--; resetPlayer2(); return 'HIT_DAMAGE';
      }
      snake2.unshift(head2);
      if (head2.x === food.x && head2.y === food.y) {
        score2 += (p2DoubleTimer > 0) ? 20 : 10; spawnFood(); return 'EAT_NORMAL';
      } else if (doubleFood && head2.x === doubleFood.x && head2.y === doubleFood.y) {
        p2DoubleTimer = 100; doubleFood = null; return 'EAT_POWERUP';
      } else snake2.pop();
      return null;
    }

    function updateUI() {
      scoreEl.textContent = score; score2El.textContent = score2;
      p1MultEl.textContent = p1DoubleTimer > 0 ? '(2X!)' : '';
      p2MultEl.textContent = p2DoubleTimer > 0 ? '(2X!)' : '';
      p1LivesEl.textContent = '❤️'.repeat(Math.max(0, p1Lives)) || '💀';
      p2LivesEl.textContent = '❤️'.repeat(Math.max(0, p2Lives)) || '💀';
    }

    function draw() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ef4444'; ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 8;
      ctx.fillRect(food.x * gridSize + 1, food.y * gridSize + 1, gridSize - 2, gridSize - 2);

      if (doubleFood) {
        ctx.fillStyle = '#eab308'; ctx.shadowColor = '#eab308'; ctx.shadowBlur = 12;
        ctx.fillRect(doubleFood.x * gridSize + 1, doubleFood.y * gridSize + 1, gridSize - 2, gridSize - 2);
        ctx.fillStyle = '#000000'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('2X', doubleFood.x * gridSize + gridSize / 2, doubleFood.y * gridSize + gridSize / 2 + 3);
      }

      if (p1Lives > 0) {
        snake.forEach((part, index) => {
          ctx.fillStyle = index === 0 ? '#10b981' : (p1DoubleTimer > 0 ? '#facc15' : '#059669');
          ctx.shadowColor = '#10b981'; ctx.shadowBlur = index === 0 ? 6 : 0;
          ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
        });
      }

      if (p2Lives > 0) {
        snake2.forEach((part, index) => {
          ctx.fillStyle = index === 0 ? '#3b82f6' : (p2DoubleTimer > 0 ? '#facc15' : '#1d4ed8');
          ctx.shadowColor = '#3b82f6'; ctx.shadowBlur = index === 0 ? 6 : 0;
          ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
        });
      }

      ctx.shadowBlur = 0; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

      if (p1Lives > 0 && snake.length > 0) {
        ctx.fillStyle = '#ffffff';
        ctx.fillText('P1', snake[0].x * gridSize + gridSize / 2, snake[0].y * gridSize + gridSize / 2);
      }

      if (p2Lives > 0 && snake2.length > 0) {
        ctx.fillStyle = '#ffffff';
        ctx.fillText('P2', snake2[0].x * gridSize + gridSize / 2, snake2[0].y * gridSize + gridSize / 2);
      }

      if (p1Lives > 0 && snake.length > 0 && p1EmoteData) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p1EmoteData.opacity);
        ctx.font = '20px sans-serif';
        ctx.fillText(p1EmoteData.emoji, snake[0].x * gridSize + gridSize / 2, (snake[0].y * gridSize - 12) - p1EmoteData.offsetY);
        ctx.restore();

        p1EmoteData.offsetY += 0.8;
        p1EmoteData.opacity -= 0.025;
        if (p1EmoteData.opacity <= 0) p1EmoteData = null;
      }

      if (p2Lives > 0 && snake2.length > 0 && p2EmoteData) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p2EmoteData.opacity);
        ctx.font = '20px sans-serif';
        ctx.fillText(p2EmoteData.emoji, snake2[0].x * gridSize + gridSize / 2, (snake2[0].y * gridSize - 12) - p2EmoteData.offsetY);
        ctx.restore();

        p2EmoteData.offsetY += 0.8;
        p2EmoteData.opacity -= 0.025;
        if (p2EmoteData.opacity <= 0) p2EmoteData = null;
      }

      if (isGameOver) {
        ctx.fillStyle = 'rgba(3, 7, 18, 0.88)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2;
        ctx.strokeRect(30, canvas.height / 2 - 50, canvas.width - 60, 100);
        ctx.fillStyle = '#f59e0b'; ctx.font = '900 18px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(winnerMessage, canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = '#9ca3af'; ctx.font = '12px sans-serif';
        ctx.fillText('Pindutin ang Restart para maglaro uli', canvas.width / 2, canvas.height / 2 + 20);
      }
    }

    function spawnFood() {
      food = { x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount) };
      snake.concat(snake2).forEach(part => { if (part.x === food.x && part.y === food.y) spawnFood(); });
    }

    function spawnDoubleFood() {
      doubleFood = { x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount) };
    }

    function resetGame() {
      p1Lives = 3; p2Lives = 3; score = 0; score2 = 0;
      p1DoubleTimer = 0; p2DoubleTimer = 0; isGameOver = false;
      winnerMessage = ""; doubleFood = null;
      p1EmoteData = null; p2EmoteData = null;

      resetPlayer1(); resetPlayer2(); spawnFood();

      if (isHost && conn && conn.open) {
        conn.send({
          type: 'SYNC', snake, snake2, food, doubleFood,
          score, score2, p1Lives, p2Lives,
          p1DoubleTimer, p2DoubleTimer,
          p1Emote: null, p2Emote: null, isGameOver, winnerMessage
        });
      }
    }

    function changeDir(dir) {
      if (document.activeElement === chatInput) return;
      initAudio();
      if (isHost) {
        if (dir === 'UP' && dy === 0) { nextDx = 0; nextDy = -1; }
        if (dir === 'DOWN' && dy === 0) { nextDx = 0; nextDy = 1; }
        if (dir === 'LEFT' && dx === 0) { nextDx = -1; nextDy = 0; }
        if (dir === 'RIGHT' && dx === 0) { nextDx = 1; nextDy = 0; }
      } else if (conn && conn.open) {
        conn.send({ type: 'INPUT', dir: dir, boost: p2Boost });
      }
    }

    document.addEventListener('keydown', (e) => {
      if (document.activeElement === chatInput) return;
      initAudio();
      if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') changeDir('UP');
      if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') changeDir('DOWN');
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') changeDir('LEFT');
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') changeDir('RIGHT');
      if (e.key === 'Shift' || e.key === ' ') {
        startBoostSound();
        if (isHost) p1Boost = true;
        else { p2Boost = true; sendClientInput(); }
      }
    });

    document.addEventListener('keyup', (e) => {
      if (document.activeElement === chatInput) return;
      if (e.key === 'Shift' || e.key === ' ') {
        stopBoostSound();
        if (isHost) p1Boost = false;
        else { p2Boost = false; sendClientInput(); }
      }
    });

    function sendClientInput(dir = null) {
      if (conn && conn.open) conn.send({ type: 'INPUT', dir: dir, boost: p2Boost });
    }

    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      initAudio();
      const touch = e.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      const touch = e.changedTouches[0];
      const deltaX = touch.clientX - touchStartX;
      const deltaY = touch.clientY - touchStartY;

      if (Math.abs(deltaX) > 20 || Math.abs(deltaY) > 20) {
        if (Math.abs(deltaX) > Math.abs(deltaY)) {
          if (deltaX > 0) changeDir('RIGHT');
          else changeDir('LEFT');
        } else {
          if (deltaY > 0) changeDir('DOWN');
          else changeDir('UP');
        }
      }
    }, { passive: false });

    const joystick = document.getElementById('joystick');
    const stick = document.getElementById('stick');
    const boostBtn = document.getElementById('boostBtn');

    let joystickTouchId = null;
    let boostTouchId = null;

    joystick.addEventListener('touchstart', (e) => {
      e.preventDefault();
      e.stopPropagation();
      initAudio();
      for (let touch of e.changedTouches) {
        if (joystickTouchId === null) {
          joystickTouchId = touch.identifier;
          updateJoystick(touch);
          break;
        }
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (joystickTouchId === null) return;
      for (let touch of e.changedTouches) {
        if (touch.identifier === joystickTouchId) {
          updateJoystick(touch);
          break;
        }
      }
    }, { passive: false });

    const handleJoystickRelease = (e) => {
      if (joystickTouchId === null) return;
      for (let touch of e.changedTouches) {
        if (touch.identifier === joystickTouchId) {
          joystickTouchId = null;
          stick.style.transform = `translate(0px, 0px)`;
          break;
        }
      }
    };

    window.addEventListener('touchend', handleJoystickRelease, { passive: false });
    window.addEventListener('touchcancel', handleJoystickRelease, { passive: false });

    function updateJoystick(touch) {
      const rect = joystick.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      let deltaX = touch.clientX - centerX;
      let deltaY = touch.clientY - centerY;
      const distance = Math.min(Math.hypot(deltaX, deltaY), 32);
      const angle = Math.atan2(deltaY, deltaX);
      
      stick.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px)`;

      if (Math.abs(deltaX) > 8 || Math.abs(deltaY) > 8) {
        if (Math.abs(deltaX) > Math.abs(deltaY)) {
          if (deltaX > 0) changeDir('RIGHT'); else changeDir('LEFT');
        } else {
          if (deltaY > 0) changeDir('DOWN'); else changeDir('UP');
        }
      }
    }

    boostBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      e.stopPropagation();
      initAudio();
      for (let touch of e.changedTouches) {
        if (boostTouchId === null) {
          boostTouchId = touch.identifier;
          startBoostSound();
          boostBtn.classList.add('active');
          if (isHost) p1Boost = true;
          else { p2Boost = true; sendClientInput(); }
          break;
        }
      }
    }, { passive: false });

    const handleBoostRelease = (e) => {
      if (boostTouchId === null) return;
      for (let touch of e.changedTouches) {
        if (touch.identifier === boostTouchId) {
          boostTouchId = null;
          stopBoostSound();
          boostBtn.classList.remove('active');
          if (isHost) p1Boost = false;
          else { p2Boost = false; sendClientInput(); }
          break;
        }
      }
    };

    window.addEventListener('touchend', handleBoostRelease, { passive: false });
    window.addEventListener('touchcancel', handleBoostRelease, { passive: false });

    initPeer();
    start();
  </script>
</body>
</html>
